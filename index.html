<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Listening Spelling Mock Tests</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--bg:#0A0F1C;--pn:#111A2E;--bd:#22304D;--bl:#3B82F6;--bl2:#1D4ED8;--tx:#F4F7FF;--mu:#8A97B1;--gr:#34D399;--rd:#F87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F3F6FC;--pn:#fff;--bd:#D5DEEE;--bl:#2563EB;--bl2:#1E40AF;--tx:#0F1A33;--mu:#5B6B82;--gr:#12805A;--rd:#C8372D}}
:root[data-theme="light"]{--bg:#F3F6FC;--pn:#fff;--bd:#D5DEEE;--bl:#2563EB;--bl2:#1E40AF;--tx:#0F1A33;--mu:#5B6B82;--gr:#12805A;--rd:#C8372D}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:18px/1.5 Outfit,system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;width:100%;display:flex;align-items:center;gap:16px;padding:0 16px}
.btn{font:inherit;font-weight:700;border:0;border-radius:16px;padding:14px 28px;cursor:pointer;color:#fff;background:var(--bl);box-shadow:0 4px 0 var(--bl2);text-transform:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bl2)}
.btn:focus-visible,.in:focus-visible,.tb:focus-visible,.chip:focus-visible{outline:3px solid var(--bl);outline-offset:3px}
.icon{width:56px;height:56px;padding:0;border-radius:50%;background:var(--pn);color:var(--bl);border:1px solid var(--bd);box-shadow:none;display:grid;place-items:center;flex:none}
.ghost{background:transparent;border:0;color:var(--mu);width:44px;height:44px}
.sec{background:var(--pn);color:var(--mu);border:1px solid var(--bd);box-shadow:0 4px 0 var(--bd)}
.lis{display:flex;align-items:center;gap:10px;font-size:20px;border-radius:999px;padding:16px 34px}
.lis small{font-weight:400;opacity:.75;font-size:13px}
.home{max-width:900px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:30px;line-height:1.2;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{font:inherit;font-size:15px;border:1px solid var(--bd);background:var(--pn);color:var(--mu);border-radius:999px;padding:8px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--bl);border-color:var(--bl);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tb{font:inherit;text-align:left;border:1px solid var(--bd);background:var(--pn);color:var(--tx);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--bd)}
.tb b{font-size:18px}.tb small{color:var(--mu);font-size:14px}
.tb:hover{border-color:var(--bl)}
.pr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{padding:16px 0;position:relative}
.track{flex:1;height:14px;background:var(--pn);border:1px solid var(--bd);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--bl);border-radius:999px;transition:width .3s}
.set{position:absolute;right:16px;top:70px;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;z-index:5;display:grid;gap:8px;font-size:16px}
.set[hidden],.peek[hidden]{display:none}
.set select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
.set label{display:flex;gap:10px;align-items:center;cursor:pointer}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;padding:6vh 16px 24px;text-align:center}
.mid h1{font-size:clamp(28px,5vw,40px)}
.cnt{color:var(--mu);margin:0 0 28px}
.row{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.peek{background:var(--pn);border:1px dashed var(--mu);border-radius:12px;padding:8px 18px;margin-bottom:18px;font-weight:700;font-size:22px}
.peek small{display:block;color:var(--mu);font-weight:400;font-size:13px}
.in{width:100%;max-width:640px;text-align:center;font:inherit;font-weight:700;font-size:clamp(24px,5vw,38px);background:var(--pn);border:2px solid var(--bd);border-radius:20px;padding:20px;color:var(--tx)}
.in::placeholder{color:var(--mu);opacity:.6}
.bar{border-top:1px solid var(--bd);padding:18px 0}
.bar .wrap{justify-content:space-between;min-height:56px}
.bar.ok{background:color-mix(in srgb,var(--gr) 14%,transparent)}
.bar.no{background:color-mix(in srgb,var(--rd) 14%,transparent)}
.bar .g{color:var(--gr);font-size:22px}
.bar .cw{display:block;color:var(--rd);font-size:24px;line-height:1.2}
.mu{color:var(--mu);font-size:14px}
.bar.ok .btn{background:var(--gr);box-shadow:0 4px 0 #0E8A5F;color:#04241A}
.bar.no .btn{background:var(--rd);box-shadow:0 4px 0 #B33A31;color:#2B0805}
.res{font-size:30px;margin:0 0 14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-weight:400;font-size:14px;padding:4px 8px}
td{padding:8px;border-top:1px solid var(--bd)}
tr.r td:nth-child(2),tr.r td:last-child{color:var(--gr)}
tr.w td:last-child{color:var(--rd)}
.x{color:var(--rd);text-decoration:underline wavy;text-underline-offset:4px}
.ans{font-weight:700}
.act{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.note{color:var(--mu);font-size:14px;margin-top:22px}
.ta{width:100%;font:14px/1.4 ui-monospace,Menlo,monospace;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px}
.h2{font-size:22px;margin:28px 0 6px}
.lnk{font:inherit;background:none;border:0;color:var(--bl);cursor:pointer;padding:6px 0;text-align:left;text-decoration:underline}
.spark{display:flex;align-items:flex-end;gap:6px;height:72px;margin:6px 0 16px}
.spark i{flex:1;background:var(--bl);border-radius:6px 6px 0 0;opacity:.85}
</style></head>

let missed=store("ielts-missed2")||[],best=store("ielts-best2")||{},hist=store("ielts-hist2")||[],cfg=store("ielts-cfg")||{slow:false,auto:true};cfg.acc=cfg.acc||"en-GB";
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(name){const a=D[name].slice(),r=rng([...name].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7));for(let k=a.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function testWords(name,n){const a=shuffled(name),L=a.length;return L<=50?a:Array.from({length:50},(_,j)=>a[(n*50+j)%L])}
function home(){
 const names=[...Object.keys(D),MISS],n=Math.max(1,Math.ceil((D[src]||[]).length/50));
 let body;
 if(src===MISS)body=missed.length?`<div class="act"><button class="btn" id="go">Practise ${Math.min(50,missed.length)} missed words</button></div>`:`<p class="sub">No missed words yet. Words you misspell are saved here.</p>`;
 else body=`<div class="grid">${Array.from({length:n},(_,k)=>{const b=best[src+"|"+k],c=hist.filter(h=>h.src===src&&h.n===k).length;return `<button class="tb" data-i="${k}"><b>Mock ${k+1}</b><small>${b!=null?"Best "+b+"/50 · "+c+"×":"Not taken"}</small></button>`}).join("")}</div>`;
 $("#app").innerHTML=`<div class="home"><h1>Listening spelling mock tests</h1><p class="sub">Pick a set, then a mock test. You hear one word at a time and type it. Every test always has the same 50 words.</p>
 <div class="chips">${names.map(x=>`<button class="chip" aria-pressed="${x===src}" data-n="${x}">${x} (${x===MISS?missed.length:D[x].length})</button>`).join("")}<button class="chip" id="prog">History</button></div>${body}
 <p class="note">Audio uses your device's voices. Choose a British, Australian, New Zealand, American or Canadian accent with the settings button during a test. Spaces and hyphens are ignored when marking.</p></div>`;
 document.querySelectorAll(".chip[data-n]").forEach(b=>b.onclick=()=>{src=b.dataset.n;home()});$("#prog").onclick=progress;
 document.querySelectorAll(".tb").forEach(b=>b.onclick=()=>start(src,+b.dataset.i));
 if($("#go"))$("#go").onclick=()=>start(MISS,0);
 window.scrollTo(0,0);
}
function when(t){return new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})}
function diff(a,w){return [...a.padEnd(w.length," ")].map((c,j)=>c.toLowerCase()===(w[j]||"").toLowerCase()?esc(c):`<span class="x">${esc(c===" "?"_":c)}</span>`).join("")}
function progress(){
 const tot=hist.length,avg=tot?Math.round(hist.reduce((a,h)=>a+h.score/h.total,0)/tot*100):0;
 const rows=hist.slice().reverse().slice(0,100).map(h=>`<tr><td><button class="lnk" data-t="${h.t}">${when(h.t)}</button></td><td>${esc(h.label)}</td><td>${h.score}/${h.total}</td></tr>`).join("");
 const spark=hist.slice(-12).map(h=>`<i style="height:${Math.max(4,Math.round(h.score/h.total*100))}%" title="${h.score}/${h.total}"></i>`).join("");
 $("#app").innerHTML=`<div class="home"><h1>Mock test history</h1><p class="sub">${tot} attempts · average ${avg}% · ${missed.length} words to practise</p>
 ${tot?`<p class="mu">Last ${Math.min(12,tot)} scores</p><div class="spark" role="img" aria-label="Recent scores">${spark}</div><p class="mu">Tap a date to see every answer from that attempt.</p><div class="tw"><table><thead><tr><th>Date</th><th>Test</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="sub">No attempts yet. Finish a mock test and it will appear here.</p>`}
 <h2 class="h2">Backup</h2><p class="sub">History is saved in this browser. Copy this text as a backup, or paste a backup here to restore it on another device.</p>
 <textarea id="bk" class="ta" rows="5" spellcheck="false" aria-label="Backup text">${esc(JSON.stringify({missed,best,hist}))}</textarea>
 <div class="act"><button class="btn" id="cp">Copy backup</button><button class="btn sec" id="im">Restore from text</button><button class="btn sec" id="bh">Back</button></div><p class="note" id="bm"></p></div>`;
 $("#bh").onclick=home;
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>detail(+b.dataset.t));
 $("#cp").onclick=async()=>{const t=$("#bk");try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand("copy")}$("#bm").textContent="Copied."};
 $("#im").onclick=()=>{try{
  const d=JSON.parse($("#bk").value);
  missed=[...new Set([...missed,...(d.missed||[])])];
  for(const k in (d.best||{}))if(best[k]==null||d.best[k]>best[k])best[k]=d.best[k];
  const seen=new Set(hist.map(h=>h.t));hist=[...hist,...(d.hist||[]).filter(h=>!seen.has(h.t))].sort((a,b)=>a.t-b.t);
  store("ielts-missed2",missed);store("ielts-best2",best);store("ielts-hist2",hist);progress();
 }catch(e){$("#bm").textContent="That text is not a valid backup."}};
 window.scrollTo(0,0);
}
function detail(t){
 const h=hist.find(x=>x.t===t);if(!h)return progress();
 const accN={"en-GB":"British","en-AU":"Australian","en-NZ":"New Zealand","en-US":"American","en-CA":"Canadian"}[h.acc]||"";
 const rows=h.ans?h.ans.map(([w,m,ok,hint],k)=>`<tr class="${ok?"r":"w"}"><td>${k+1}</td><td>${ok?esc(m):(m?diff(m,w):"(empty)")}</td><td class="ans">${esc(w)}</td><td>${ok?"✓":hint?"hint":"✗"}</td></tr>`).join(""):(h.wrong||[]).map((w,k)=>`<tr class="w"><td>${k+1}</td><td>–</td><td class="ans">${esc(w)}</td><td>✗</td></tr>`).join("");
 $("#app").innerHTML=`<div class="home"><h1 class="res">${h.score} out of ${h.total}</h1><p class="sub">${esc(h.label)} · ${when(h.t)}${accN?" · "+accN+" voice":""}</p>
 ${h.ans?"":`<p class="mu">Older attempt: only the words you missed were saved.</p>`}
 <div class="tw"><table><thead><tr><th>#</th><th>My answer</th><th>Correct answer</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="act">${h.src!=null?`<button class="btn" id="rt">Retake this test</button>`:""}<button class="btn sec" id="bk2">Back to history</button><button class="btn sec" id="del">Delete attempt</button></div></div>`;
 $("#bk2").onclick=progress;
 if($("#rt"))$("#rt").onclick=()=>start(h.src,h.n);
 $("#del").onclick=()=>{hist=hist.filter(x=>x.t!==t);store("ielts-hist2",hist);progress()};
 window.scrollTo(0,0);
}
function start(name,n){cur={name,n};words=name===MISS?missed.slice(0,50):testWords(name,n);i=0;res=[];practice()}
function voice(){const v=speechSynthesis.getVoices(),f=x=>x.lang.replace("_","-").toLowerCase(),FB={"en-nz":["en-au","en-gb"],"en-ca":["en-us"],"en-au":["en-gb"]};for(const l of [cfg.acc.toLowerCase(),...(FB[cfg.acc.toLowerCase()]||[])]){const m=v.find(x=>f(x)===l);if(m)return m}return v.find(x=>f(x).startsWith("en"))||null}
function play(){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(words[i]);u.rate=cfg.slow?0.55:0.85;u.lang=cfg.acc;const v=voice();if(v)u.voice=v;
 speechSynthesis.speak(u);
}
function practice(){
 checked=false;
 $("#app").innerHTML=`<div class="pr"><header class="top"><div class="wrap"><button class="btn icon ghost" id="x" aria-label="Quit test">${IX}</button><div class="track"><i style="width:${i/words.length*100}%"></i></div><button class="btn icon ghost" id="gear" aria-label="Settings">${IG}</button></div>
 <div class="set" id="set" hidden><label><input type="checkbox" id="c1" ${cfg.slow?"checked":""}> Slow speech</label><label><input type="checkbox" id="c2" ${cfg.auto?"checked":""}> Play each word automatically</label><label>Accent <select id="c3"><option value="en-GB">British</option><option value="en-AU">Australian</option><option value="en-NZ">New Zealand</option><option value="en-US">American</option><option value="en-CA">Canadian</option></select></label><span class="mu">Uses voices installed on your device</span></div></header>
 <main class="mid"><h1>Type what you hear</h1><p class="cnt">Word ${i+1} of ${words.length}</p>
 <div class="row"><button class="btn lis" id="lis">${IS} Listen <small>Ctrl + Space</small></button><button class="btn icon" id="eye" aria-label="Show the word (counts as a miss)">${IE}</button></div>
 <div class="peek" id="peek" hidden></div>
 <input class="in" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Type the spelling here…"></main>
 <footer class="bar" id="bar"><div class="wrap"><div id="fb"></div><button class="btn" id="chk">Check</button></div></footer></div>`;
 $("#x").onclick=home;$("#lis").onclick=()=>{play();$("#ans").focus()};
 $("#gear").onclick=()=>{$("#set").hidden=!$("#set").hidden};
 $("#c1").onchange=e=>{cfg.slow=e.target.checked;store("ielts-cfg",cfg)};
 $("#c3").value=cfg.acc;$("#c3").onchange=e=>{cfg.acc=e.target.value;store("ielts-cfg",cfg);play();$("#ans").focus()};
 $("#c2").onchange=e=>{cfg.auto=e.target.checked;store("ielts-cfg",cfg)};
 $("#eye").onclick=()=>{const p=$("#peek");p.hidden=false;p.innerHTML=`${esc(words[i])}<small>Hint used – this word will count as a miss</small>`};
 $("#chk").onclick=act;
 $("#ans").onkeydown=e=>{if(e.key==="Enter")act()};
 $("#ans").focus();
 if(cfg.auto)setTimeout(play,350);
}
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.code==="Space"&&$("#lis")){e.preventDefault();play()}});
function act(){checked?next():check()}
function check(){
 const a=$("#ans").value.trim(),w=words[i],hint=!$("#peek").hidden,ok=!hint&&norm(a)===norm(w);
 res.push({w,a,ok,hint});
 if(ok)missed=missed.filter(x=>x!==w);else if(!missed.includes(w))missed.push(w);
 store("ielts-missed2",missed);
 checked=true;$("#ans").readOnly=true;
 $("#bar").className="bar "+(ok?"ok":"no");
 $("#fb").innerHTML=ok?`<b class="g">Correct!</b>`:`<span class="mu">Correct spelling</span><b class="cw">${esc(w)}</b>`;
 $("#chk").textContent=i+1<words.length?"Continue":"Finish";
 $("#chk").focus();
}
function next(){i++;i<words.length?practice():finish()}
function finish(){
 const score=res.filter(r=>r.ok).length;
 if(cur.name!==MISS){const k=cur.name+"|"+cur.n;if(best[k]==null||score>best[k])best[k]=score;store("ielts-best2",best)}
 hist.push({t:Date.now(),label:cur.name===MISS?"Missed words":cur.name+" · Mock "+(cur.n+1),score,total:words.length,acc:cfg.acc,src:cur.name,n:cur.n,ans:res.map(r=>[r.w,r.a,r.ok?1:0,r.hint?1:0]),wrong:res.filter(r=>!r.ok).map(r=>r.w)});hist=hist.slice(-300);store("ielts-hist2",hist);
 const rows=res.map((r,k)=>{let mine=esc(r.a)||"(empty)";
  if(!r.ok&&r.a)mine=[...r.a.padEnd(r.w.length," ")].map((c,j)=>c.toLowerCase()===(r.w[j]||"").toLowerCase()?esc(c):`<span class="x">${esc(c===" "?"_":c)}</span>`).join("");
  return `<tr class="${r.ok?"r":"w"}"><td>${k+1}</td><td>${mine}</td><td class="ans">${esc(r.w)}</td><td>${r.ok?"✓":r.hint?"hint":"✗"}</td></tr>`}).join("");
 $("#app").innerHTML=`<div class="home"><h1 class="res">${score} out of ${words.length}</h1>
 <div class="tw"><table><thead><tr><th>#</th><th>My answer</th><th>Correct answer</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
 <p class="note">Saved to your history.</p><div class="act"><button class="btn" id="again">Retry this test</button><button class="btn sec" id="back">All tests</button></div></div>`;
 $("#again").onclick=()=>start(cur.name,cur.n);$("#back").onclick=home;window.scrollTo(0,0);
}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
home();
</script></body></html>
